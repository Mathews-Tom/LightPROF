[project]
name = "lightprof"
version = "0.2.0"
description = "LightPROF: A Lightweight Reasoning Framework for LLM on Knowledge Graph (arXiv:2504.03137)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "sentencepiece>=0.2.0",
    # Data processing
    "networkx>=3.4.2",
    "datasets>=2.18.0",
    # Configuration
    "tomli>=2.0.0",
    "python-dotenv>=1.1.0",
    # Development
    "jupyter>=1.1.1",
    "pytest>=8.3.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
