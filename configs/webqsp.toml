# LightPROF Configuration for WebQSP Dataset
# WebQSP: 4,737 questions, up to 2-hop reasoning

[model]
llm_name = "meta-llama/Meta-Llama-3-8B-Instruct"
llm_embedding_dim = 4096
bert_model_name = "bert-base-uncased"
bert_embedding_dim = 768
freeze_llm = true
freeze_bert = true

[adapter]
structural_mlp_hidden_dim = 64
knowledge_encoder_layers = 2
knowledge_encoder_heads = 8
projector_hidden_dim = 2048
dropout = 0.1

[retrieval]
max_hops = 2  # WebQSP is up to 2-hop
top_k_relations = 10
max_paths_per_question = 20
use_hop_predictor = true

[training]
batch_size = 4
learning_rate = 2e-3
num_epochs = 1
warmup_ratio = 0.1
weight_decay = 0.01
gradient_accumulation_steps = 1
max_grad_norm = 1.0
fp16 = true
seed = 42

[data]
kg_path = "data/freebase_webqsp.tsv"
train_path = "data/webqsp/train.json"
val_path = "data/webqsp/val.json"
test_path = "data/webqsp/test.json"
dataset_name = "webqsp"
